# DRAFT — manual only, does nothing until Coolify exists and the settings below are filled in.
#
# Builds the two production images once, pushes them to GHCR tagged with the commit, then asks
# Coolify to redeploy. The `production` environment must have required reviewers: the approval
# click is what gates the deploy job (Settings → Environments → production).
#
# Setup, once Coolify is running (all are repository / environment settings, never files):
#   Variables (public values, baked into the web image by `next build`):
#     NEXT_PUBLIC_API_BASE_URL, STORAGE_PUBLIC_URL, NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY (pk_live_…)
#   Secrets, on the `production` environment:
#     COOLIFY_URL          https://<coolify dashboard domain>
#     COOLIFY_TOKEN        Coolify API token (Keys & Tokens), deploy permission only
#     COOLIFY_API_UUID     the API application's UUID
#     COOLIFY_WEB_UUID     the web application's UUID
#   In Coolify, each app is switched to "Docker image" from ghcr.io/<owner>/fonology-{api,web},
#   with a registry login (a read-only PAT with read:packages) if the packages stay private.
#
# Migrations are NOT a job here: Postgres is on the private Docker network (no published 5432),
# so a GitHub runner cannot reach it. They run in the API container's entrypoint when
# MIGRATE_DATABASE_URL is set for that deploy (docs/go-live.md §4.3) — keep it that way.
#
# Rollback: redeploy the previous sha tag in Coolify (docs/go-live.md → Rollback).
name: Deploy

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit to deploy (default — the branch you ran this from; use main)
        type: string
        default: ""

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/fonology

jobs:
  build:
    name: Build and push images
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - id: meta
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Refuse a commit the rehearsal has not passed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ok=$(gh api "repos/${{ github.repository }}/actions/workflows/rehearsal.yml/runs?head_sha=${{ steps.meta.outputs.sha }}&status=success" --jq '.total_count')
          [ "$ok" -ge 1 ] || { echo "No successful 'Production rehearsal' run for ${{ steps.meta.outputs.sha }}"; exit 1; }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-api:${{ steps.meta.outputs.sha }}
            ${{ env.IMAGE_PREFIX }}-api:latest
          cache-from: type=gha,scope=api
      - name: Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL }}
            STORAGE_PUBLIC_URL=${{ vars.STORAGE_PUBLIC_URL }}
            NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          tags: |
            ${{ env.IMAGE_PREFIX }}-web:${{ steps.meta.outputs.sha }}
            ${{ env.IMAGE_PREFIX }}-web:latest
          cache-from: type=gha,scope=web

  deploy:
    name: Deploy via Coolify (needs approval)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    steps:
      - name: Trigger API, then web
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          set -eu
          for uuid in "${{ secrets.COOLIFY_API_UUID }}" "${{ secrets.COOLIFY_WEB_UUID }}"; do
            curl -fsS -X POST -H "Authorization: Bearer $COOLIFY_TOKEN" \
              "$COOLIFY_URL/api/v1/deploy?uuid=$uuid&force=true" >/dev/null
            echo "deploy queued"
          done
      - name: Wait for the live site to report healthy
        env:
          API_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
        run: |
          for i in $(seq 1 30); do
            curl -fsS "$API_URL/health/ready" >/dev/null && { echo "ready"; exit 0; }
            sleep 10
          done
          echo "API did not become ready within 5 minutes"; exit 1
