# The deploy button: Actions → Deploy → Run workflow (branch: main). Anyone with write access can press it.
#
# It deploys the current tip of main to the live site: fonology-api first, then fonology-web, each built
# by Coolify on the server exactly as a deploy from the Coolify dashboard would be. It refuses when:
#   - it was not run from main, or main has moved on since it started;
#   - CI or the Production rehearsal has not passed on that commit (the rehearsal takes ~25 minutes
#     after a merge; wait for it);
#   - the change adds or edits a database migration (a migration deploy needs MIGRATE_DATABASE_URL set
#     on the server for one deploy, CLAUDE.md section 5; the operator does that by hand);
#   - an application is pinned to an older commit (a rollback is in place), or another deploy is running.
#
# How it reaches the server: SSH as user `ghdeploy`, whose only key can run nothing but
# /usr/local/sbin/fonology-gh-deploy (`status` / `deploy <sha>`), which calls Coolify's API on the server
# with a read+deploy-only token. No shell, no tunnel, no Coolify dashboard access.
#
# Repository secrets (never in this file; the repo is public and so are these run logs):
#   DEPLOY_HOST         the server's address
#   DEPLOY_SSH_KEY      private half of the ghdeploy key
#   DEPLOY_KNOWN_HOSTS  the server's ed25519 host key line (pinned; a changed host key fails the run)
#   DISCORD_WEBHOOK_URL optional; posts "deployed" / "deploy failed" to #fonology-alerts
# Repository variables: UPTIME_WEB_URL, UPTIME_API_URL (also used by uptime.yml).
#
# Rollback is not a button: the operator pins the last good commit in Coolify (CLAUDE.md section 5).
name: Deploy

on:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    name: Deploy main to the live site
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      SHA: ${{ github.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Only from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Run this from the main branch (it was run from ${{ github.ref_name }})."
          exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: main has not moved on
        run: |
          tip=$(git ls-remote origin refs/heads/main | cut -f1)
          [ "$tip" = "$SHA" ] || { echo "main is now $tip, this run is for $SHA. Run the workflow again."; exit 1; }

      - name: CI and the Production rehearsal passed on this commit
        run: |
          for wf in ci.yml rehearsal.yml; do
            ok=$(gh api "repos/${{ github.repository }}/actions/workflows/$wf/runs?head_sha=$SHA&status=success" --jq '.total_count')
            if [ "$ok" -lt 1 ]; then
              state=$(gh api "repos/${{ github.repository }}/actions/workflows/$wf/runs?head_sha=$SHA" --jq '.workflow_runs[0].status // "not started"')
              echo "$wf has not passed on $SHA (latest run: $state). Wait for it to finish green, then run Deploy again."
              exit 1
            fi
            echo "$wf passed"
          done

      - name: Set up the deploy key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          [ -n "$DEPLOY_SSH_KEY" ] && [ -n "$DEPLOY_KNOWN_HOSTS" ] && [ -n "$DEPLOY_HOST" ] ||
            { echo "Deploy secrets are not set (see the top of this file)."; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host fonology\n  HostName %s\n  User ghdeploy\n  IdentityFile ~/.ssh/deploy_key\n  IdentitiesOnly yes\n  StrictHostKeyChecking yes\n  BatchMode yes\n  ServerAliveInterval 30\n' \
            "$DEPLOY_HOST" > ~/.ssh/config

      - name: What is live now
        id: live
        run: |
          ssh fonology status | tee status.txt
          api=$(sed -n 's/^api deployed=\([0-9a-f]*\).*/\1/p' status.txt)
          echo "api=$api" >> "$GITHUB_OUTPUT"

      - name: No new database migrations
        env:
          LIVE: ${{ steps.live.outputs.api }}
        run: |
          git cat-file -e "$LIVE^{commit}" 2>/dev/null ||
            { echo "The live API commit ($LIVE) is not in main's history. Ask the operator."; exit 1; }
          changed=$(git diff --name-only "$LIVE" "$SHA" -- db/migrations)
          if [ -n "$changed" ]; then
            echo "This deploy includes migration changes, which need the operator (CLAUDE.md section 5):"
            echo "$changed"
            exit 1
          fi
          echo "Changes going live ($LIVE..$SHA):"
          git log --oneline "$LIVE..$SHA" | head -40

      - name: Deploy (API, then web)
        run: ssh fonology deploy "$SHA"

      - name: The live site answers
        env:
          WEB: ${{ vars.UPTIME_WEB_URL }}
          API: ${{ vars.UPTIME_API_URL }}
        run: |
          site=$(printf '%s' "$WEB" | sed 's#^\(https://[^/]*\).*#\1#')
          fail=0
          for url in "$API" "$WEB" "$site/" "$site/shop" "$site/repair"; do
            code=$(curl -s -m 20 -o /dev/null -w '%{http_code}' "$url" || true)
            echo "$code $url"
            [ "$code" = "200" ] || fail=1
          done
          exit $fail

      - name: Tell Discord
        if: always() && steps.live.outcome != 'skipped'
        env:
          DISCORD: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RESULT: ${{ job.status }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$DISCORD" ] || exit 0
          if [ "$RESULT" = "success" ]; then msg="Deployed ${SHA:0:7} to the live site (by ${{ github.actor }})."
          else msg="DEPLOY FAILED for ${SHA:0:7} (by ${{ github.actor }}): $RUN"; fi
          curl -s -m 20 -o /dev/null -H 'Content-Type: application/json' \
            -d "{\"username\":\"Fonology deploy\",\"content\":\"$msg\"}" "$DISCORD" || true
