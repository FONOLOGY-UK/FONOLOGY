packages:
  - "apps/*"
  - "packages/*"

# Native postinstall builds we explicitly allow.
# - sharp: used by Next.js image optimization in production.
# - unrs-resolver: native resolver used by the ESLint import plugin.
# - esbuild: used by tsx, which is how apps/api runs. Left unset, pnpm 11
#   writes a placeholder here and every subsequent `pnpm install` exits 1 —
#   which also breaks `pnpm run dev` in apps/web, since its predev deps check
#   shells out to install.
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true

# Security floors for transitive deps whose parents haven't caught up.
# - qs: express 4 still ranges it below 6.16.0 (two DoS advisories on the
#   request-body/query parser, reachable on every API route).
overrides:
  qs: ">=6.16.0"
