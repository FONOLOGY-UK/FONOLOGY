# Every push and pull request: typecheck, lint, and that both production images build. No secrets.
# The full production rehearsal is rehearsal.yml (main only — it takes ~25 minutes).
name: CI

on:
  push:
  pull_request:

# A newer push to the same branch supersedes a run still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # the version comes from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The local-dev .env.local files (no secrets — the dev stack's fixed values); the API's
      # config refuses to load without them, and some scripts are typechecked against it.
      - run: pnpm setup:env
      # next-env.d.ts and .next/types are generated and gitignored; the web typecheck needs them.
      - run: pnpm --filter @fonology/web exec next typegen
      - run: pnpm typecheck
      - run: pnpm lint

  images:
    name: Production images build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      # Build variables are baked in by `next build`; placeholder values prove the image builds
      # (pnpm 9 vs 11 hoisting once broke only the Docker build). The deployed image is built
      # with the real ones.
      - name: Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=https://api.example.invalid
            STORAGE_PUBLIC_URL=https://photos.example.invalid
            NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=pk_test_placeholder
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
